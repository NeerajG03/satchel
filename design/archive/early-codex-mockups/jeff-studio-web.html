      <aside class="j-side"><div class="j-brand"><span class="j-brand-mark">j.</span>jeff<small>V2</small></div><div class="j-nav-label">WORKSPACE</div><nav class="j-nav" aria-label="Main navigation"></nav><div class="j-side-note">Your apps do the work.<br>You shape the context.</div><div data-part="appearance"></div><div class="j-person"><span class="j-avatar">NG</span><div>Neeraj<small>Personal setup</small></div></div></aside>
      <div><header class="j-top"><div class="j-breadcrumb">Personal <span>/</span> <strong data-part="crumb">Overview</strong></div><button class="j-button" data-action="nav" data-id="preview"><i data-lucide="scan-eye" aria-hidden="true"></i>Preview agent context</button></header><main class="j-main" data-part="main"></main><div class="j-notification" data-part="notice" role="status" aria-live="polite"></div></div>

<script>
(()=>{
const root=document.getElementById('jeff-studio-web');
const main=root.querySelector('[data-part="main"]');
const state={route:'overview',selected:null,filter:'all',query:'',online:true,storage:'hosted',endpoint:'https://memory.example.com/mcp',previewApp:'codex',previewProject:'pilot',memoryHistory:false,test:null,edit:null};
const design={tone:'Cobalt',density:'Comfortable',corners:12};
let appearance='System';
const apps=[
 {id:'codex',name:'Codex',surface:'Desktop · laptop',symbol:'>_',class:'j-codex',connected:true,read:true,write:true,projects:['pilot','release'],skills:['review','testing']},
 {id:'claude',name:'Claude',surface:'Android · phone',symbol:'✳',class:'j-claude',connected:true,read:true,write:false,projects:['pilot','reimburse'],skills:[]},
 {id:'chatgpt',name:'ChatGPT',surface:'Web',symbol:'◎',class:'',connected:false,read:true,write:false,projects:['pilot'],skills:[]}
];
const projects=[
 {id:'pilot',name:'JEFF v2',space:'Personal',description:'A companion for shared agent context.',source:'personal-context / projects / jeff-v2',tracker:'GitHub Issues',repo:'jeff',brief:'Help my AI apps use the same relevant decisions and preferences. Start with explicit memory and existing services. Keep everyday conversations in the AI apps.',task:'Prove a phone-to-laptop correction',next:'Connect phone write access, then retrieve a corrected record from a fresh desktop conversation.'},
 {id:'release',name:'Release workflow',space:'Work',description:'Consistent checks across engineering repositories.',source:'work-context / projects / releases',tracker:'GitHub Issues',repo:'frontend',brief:'Keep release checks near the code. GitHub Issues is the only task backend in V1. Keep the backend open to future task-source integrations. Link contributing PRs without closing the parent task early.',task:'Verify a release across repositories',next:'Read the authoritative team ticket and inspect the required validation.'},
 {id:'reimburse',name:'Reimbursements',space:'Personal',description:'Claim rules and links to supporting documents.',source:'personal-context / projects / reimbursements',tracker:'GitHub Issues',repo:null,brief:'Keep reusable claim instructions here. Receipts and statements remain in restricted document storage, outside general memory search.',task:'Prepare the next claim cycle',next:'Collect the required receipts, then run the processing skill on a configured laptop.'}
];
let memories=[
 {id:'m1',text:'JEFF v2 has no personas and no curator in the initial version.',scope:'project',project:'pilot',space:'Personal',type:'Decision',source:'You · Claude on Android',date:'6 Sep, 9:18',revision:2,history:[{text:'Explore dedicated agent roles for the pilot.',date:'Earlier example',revision:1}]},
 {id:'m2',text:'Use plain language. Lead with the outcome and keep the explanation practical.',scope:'user',project:'',space:'Personal',type:'Preference',source:'You · explicit save',date:'5 Sep, 18:42',revision:1,history:[]},
 {id:'m3',text:'V1 uses GitHub Issues only. Third-party task-source plugins come later.',scope:'project',project:'release',space:'Work',type:'Decision',source:'You · Codex on desktop',date:'5 Sep, 17:06',revision:1,history:[]},
 {id:'m4',text:'Run the existing frontend checks before preparing a release handover.',scope:'repo',project:'release',space:'Work',type:'Instruction',source:'You · explicit save',date:'5 Sep, 16:30',revision:1,history:[]},
 {id:'m5',text:'Keep bank statements outside the shared context store.',scope:'project',project:'reimburse',space:'Personal',type:'Decision',source:'You · explicit save',date:'4 Sep, 11:12',revision:1,history:[]}
];
const skills=[
 {id:'review',name:'PR review',description:'Review changes against project rules and explain actionable findings.',kind:'Instructions',where:'Configured coding apps',version:'1.2',source:'agent-skills / pr-review'},
 {id:'testing',name:'Writing tests',description:'Choose useful tests and run the checks the codebase actually needs.',kind:'Local tools',where:'Laptop with repository access',version:'1.0',source:'agent-skills / writing-tests'},
 {id:'reimbursement',name:'Reimbursement',description:'Prepare claim documents from approved local inputs.',kind:'Local script',where:'Laptop with Python and private files',version:'1.1',source:'agent-skills / reimbursement'},
 {id:'release',name:'Release checklist',description:'Gather checks, contributing PRs, and a complete handover.',kind:'Connected tools',where:'Apps with authorized repository tools',version:'1.0',source:'agent-skills / release'}
];
const navs=[['overview','Overview','layout-dashboard'],['connections','Connections','plug'],['memory','Memory','bookmark'],['projects','Projects','folder'],['skills','Skills','book-open'],['settings','Settings','sliders-horizontal']];
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const btn=(label,action,id='',style='')=>`<button type="button" class="j-button ${style}" data-action="${action}" data-id="${esc(id)}">${label}</button>`;
const link=(label,action,id='')=>`<button type="button" class="j-link" data-action="${action}" data-id="${esc(id)}">${label}</button>`;
const chip=(label,cls='')=>`<span class="j-chip ${cls}">${label}</span>`;
const project=id=>projects.find(p=>p.id===id);
const app=id=>apps.find(a=>a.id===id);
const scope=m=>m.scope==='user'?'You':m.scope==='repo'?`Repo · ${project(m.project)?.repo||'repository'}`:`Project · ${project(m.project)?.name||m.project}`;
const appIcon=a=>`<span class="j-appicon ${a.class}">${a.symbol}</span>`;
function heading(title,sub,action=''){return `<div class="j-heading"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function back(route,label='Back'){return `<div style="margin-bottom:12px">${btn(icon('arrow-left')+label,'nav',route,'j-quiet')}</div>`}
function applyTheme(){root.style.colorScheme=appearance==='System'?'light dark':appearance.toLowerCase();root.querySelectorAll('[data-part="appearance"]').forEach(el=>{el.innerHTML=`<div class="j-theme-switch" role="group" aria-label="Appearance">${[['Light','sun'],['Dark','moon'],['System','monitor']].map(([label,i])=>`<button type="button" data-action="theme" data-id="${label}" aria-label="${label} appearance" aria-pressed="${appearance===label}">${icon(i)}<span>${label}</span></button>`).join('')}</div>`});const mobile=root.querySelector('[data-action="cycle-theme"]');mobile.setAttribute('aria-label','Appearance: '+appearance+'. Switch to '+(appearance==='System'?'Light':appearance==='Light'?'Dark':'System'));paint()}
function notify(msg){root.querySelector('[data-part="notice"]').textContent=msg}
function navigate(route,id=null){state.route=route;state.selected=id;state.query='';state.filter='all';state.edit=null;state.memoryHistory=false;notify('');render()}
function paint(){if(globalThis.lucide)lucide.createIcons({root,attrs:{width:18,height:18}})}
function memoryRow(m){return `<button type="button" class="j-item" data-action="memory-detail" data-id="${m.id}"><span class="j-grow"><span class="j-row" style="gap:7px;margin-bottom:7px">${chip(m.type,'j-outline')}<span class="j-tiny j-muted">${esc(scope(m))}</span></span><strong style="font-weight:500">${esc(m.text)}</strong><small>${esc(m.source)} · ${m.date}</small></span>${icon('chevron-right')}</button>`}
function appRow(a){return `<button type="button" class="j-item" data-action="connection" data-id="${a.id}">${appIcon(a)}<span class="j-grow"><strong>${a.name}</strong><small>${a.surface}</small></span>${chip(a.connected?(a.write?'Read + save':'Read only'):'Set up',a.connected?'':'j-warning')}${icon('chevron-right')}</button>`}
function overview(){const connected=apps.filter(a=>a.connected),latest=memories[0];return heading('Your setup.','A shared starting point for the apps you work in.')+
 `<section class="j-studio-hero" aria-label="Shared context route"><div class="j-studio-summary"><div><div class="j-overline">CONTEXT DELIVERY</div><h2>Your context.<br><span>Across your apps.</span></h2><p>${memories.length} explicit records, ${projects.length} project spaces, and ${connected.length} connected apps. You decide what travels.</p></div><div class="j-route-preview"><button type="button" data-action="nav" data-id="memory">${icon('database')}<span>Shared memory</span><span style="margin-left:auto;color:var(--j-muted)">${memories.length} records</span></button><div class="j-route-gap"></div><button type="button" data-action="nav" data-id="projects">${icon('folder-open')}<span>Project & access scope</span></button><div class="j-route-gap"></div><div class="j-route-end">${icon('corner-down-right')} ${connected.map(a=>a.name).join(' + ')} <span style="margin-left:auto">${link('Inspect','nav','preview')}</span></div></div></div><div class="j-studio-action"><div class="j-row">${btn(icon('scan-eye')+'Preview context','nav','preview','j-primary')}${btn('Check connections '+icon('arrow-up-right'),'nav','test')}</div><span class="j-inspect-meta">EXPLICIT SAVES ONLY</span></div></section>
 <div class="j-grid"><section><div class="j-section-title"><h3>Your apps <span class="j-muted" style="font-size:11px;margin-left:5px">${apps.length}</span></h3>${link('Manage connections '+icon('arrow-up-right'),'nav','connections')}</div><div class="j-box j-list">${apps.map(appRow).join('')}</div><div class="j-service-row">${icon('database')}<span class="j-grow">${state.storage==='hosted'?'Hosted memory':'Your memory server'}<small>Shared source · ${state.online?'available in this demo':'unavailable'}</small></span>${link('Configure '+icon('arrow-up-right'),'nav','settings')}</div><div class="j-service-row" style="margin-top:0;border-top:0">${icon('github')}<span class="j-grow">GitHub Issues<small>Task backend · built in</small></span>${link('Projects '+icon('arrow-up-right'),'nav','projects')}</div></section>
 <section class="j-stack"><div><div class="j-section-title"><h3>Attention</h3>${chip(app('claude').write?'Ready to check':'1 setup step',app('claude').write?'j-outline':'j-warning')}</div><div class="j-alert-card"><div class="j-alert-heading">${icon(app('claude').write?'circle-check':'circle-alert')} ${app('claude').write?'Connection configured':'Phone write access'}</div><h3>${app('claude').write?'Test the handoff.':'Claude can read.<br>It can’t save yet.'}</h3><p>${app('claude').write?'Verify that an explicit phone save appears in a fresh desktop conversation.':'Allow explicit saves to carry decisions from your phone into the next conversation.'}</p>${btn(app('claude').write?'Run a check '+icon('arrow-right'):'Review access '+icon('arrow-right'),app('claude').write?'nav':'connection',app('claude').write?'test':'claude')}</div></div>
 ${latest?`<div class="j-home-secondary j-recent"><div class="j-section-title"><h3>Latest memory</h3>${link('View all','nav','memory')}</div><div class="j-recent-meta">${esc(scope(latest)).toUpperCase()} · REV ${latest.revision}</div><blockquote>“${esc(latest.text)}”</blockquote><div class="j-between"><span class="j-tiny j-muted">${esc(latest.source)}</span>${link('Read '+icon('arrow-up-right'),'memory-detail',latest.id)}</div></div>`:''}</section></div>
 <p class="j-footer-note">Design preview · sample data · no live connections or backend writes.</p>`}

function connections(){return heading('Connections','Choose which apps can access your shared context.')+`<div class="j-note">${icon('info')}Connections provide access. A successful test also checks whether an app retrieves the right context.</div><div class="j-box" style="margin-top:20px">${apps.map(appRow).join('')}</div><div class="j-section-title"><h3>One memory source</h3>${link('Change configuration','nav','settings')}</div><div class="j-box"><div class="j-row">${icon('database')}<div><h3>${state.storage==='hosted'?'Hosted service':'Self-hosted server'}</h3><p class="j-small j-muted">Separate work and personal access · explicit saves</p></div></div></div><div style="margin-top:22px">${btn(icon('circle-check')+'Run a connection check','nav','test','j-primary')}</div>`}

function memory(){const filtered=memories.filter(m=>(state.filter==='all'||m.scope===state.filter)&&(m.text+' '+scope(m)).toLowerCase().includes(state.query.toLowerCase()));return heading('Memory','What you have explicitly asked your agents to remember.',btn(icon('plus')+'Save a memory','nav','save','j-primary'))+`<div class="j-toolbar"><input data-control="memory-search" aria-label="Search memories" placeholder="Search saved context" value="${esc(state.query)}"><select data-control="memory-filter" aria-label="Memory scope"><option value="all">All scopes</option><option value="user" ${state.filter==='user'?'selected':''}>You</option><option value="project" ${state.filter==='project'?'selected':''}>Projects</option><option value="repo" ${state.filter==='repo'?'selected':''}>Repositories</option></select></div><div data-part="memory-results">${filtered.length?`<div class="j-box j-list">${filtered.map(memoryRow).join('')}</div>`:`<div class="j-empty"><h3>No matching memories</h3><p>Try another phrase or save a new explicit decision.</p></div>`}</div><p class="j-footer-note">Sample records · no automatic extraction or review queue.</p>`}
function memoryDetail(){const m=memories.find(x=>x.id===state.selected);if(!m)return back('memory','Memory')+heading('Memory removed','This record is no longer in active demo retrieval.');return back('memory','Memory')+heading('Saved memory',scope(m))+`<div class="j-stack"><div class="j-box"><div class="j-between">${chip(m.type,'j-outline')}${chip('Current · revision '+m.revision)}</div><p class="j-memorytext" style="font-size:21px;margin:24px 0!important">${esc(m.text)}</p><dl class="j-meta"><dt>Saved by</dt><dd>${esc(m.source)}</dd><dt>Authority</dt><dd>Explicitly user-stated · sample record</dd><dt>Updated</dt><dd>${m.date}</dd><dt>Visibility</dt><dd>${m.space} · allowed apps only</dd><dt>Record</dt><dd>${m.id}</dd></dl></div><div class="j-row">${btn(icon('pencil')+'Correct this memory','correct',m.id,'j-primary')}${btn(icon('history')+'History','history',m.id)}${btn('Forget','forget',m.id,'j-danger')}</div>${state.memoryHistory?`<div class="j-box"><h3>Previous versions</h3>${m.history.length?m.history.map(h=>`<div class="j-history">${chip('Superseded · revision '+h.revision,'j-outline')}<p style="margin:10px 0">${esc(h.text)}</p><small>${h.date}</small></div>`).join(''):'<p class="j-muted j-small" style="margin-top:12px">No previous versions.</p>'}<p class="j-small j-muted" style="margin-top:15px">Old versions explain history. They are excluded from current context.</p></div>`:''}</div>`}

function skillDetail(){const s=skills.find(x=>x.id===state.selected)||skills[0];return back('skills','Skills')+heading(s.name,s.description)+`<div class="j-stack"><div class="j-box"><div class="j-between">${chip(s.kind)}${chip('v'+s.version,'j-outline')}</div><dl class="j-meta" style="margin-top:20px"><dt>Source</dt><dd>${s.source}</dd><dt>Runs in</dt><dd>${s.where}</dd><dt>Distribution</dt><dd>Existing skills installer</dd></dl></div><div class="j-box"><h3>Installation targets</h3>${apps.map(a=>`<div class="j-item">${appIcon(a)}<span class="j-grow"><strong>${a.name}</strong><small>${a.id==='codex'?'Compatible desktop target':a.id==='claude'?'Phone can view instructions; local execution unavailable':'Client support must be verified'}</small></span>${a.id==='codex'?chip(a.skills.includes(s.id)?'Installed · demo':'Not installed','j-outline'):chip('Reference only','j-outline')}</div>`).join('')}</div><div class="j-row">${btn('View setup steps','skill-setup',s.id,'j-primary')}${btn('Read instructions','skill-read',s.id)}</div></div>`}

function preview(){const a=app(state.previewApp),p=project(state.previewProject)||projects[0],allowed=a.connected&&a.read&&a.projects.includes(p.id),records=allowed?memories.filter(m=>m.project===p.id||(m.scope==='user'&&m.space===p.space)):[];return heading('What your agent receives','Inspect the relevant context before a fresh conversation.')+`<div class="j-columns" style="margin-bottom:20px"><label class="j-field">App<select data-control="preview-app">${apps.map(x=>`<option value="${x.id}" ${x.id===a.id?'selected':''}>${x.name} · ${x.surface}</option>`).join('')}</select></label><label class="j-field">Project<select data-control="preview-project">${projects.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.name}</option>`).join('')}</select></label></div>${!state.online?`<div class="j-empty"><h3>Memory service unavailable</h3><p>Current memory cannot be verified. The preview does not substitute an older record.</p>${btn('Check configuration','nav','settings')}</div>`:!allowed?`<div class="j-empty">${icon('lock-keyhole')}<h3 style="margin-top:10px">This context is not available to ${a.name}</h3><p>Connect the app and grant read access to this project.</p>${btn('Review access','connection',a.id,'j-primary')}</div>`:`<div class="j-stack"><div class="j-note">${icon('scan-eye')}Simulated retrieval · ${p.space} context · current records only</div><div class="j-box"><div class="j-overline">PROJECT BRIEF</div><h2>${p.name}</h2><p style="margin:12px 0">${esc(p.brief)}</p><div class="j-tiny j-muted">Source: ${esc(p.source)}</div></div><div class="j-box"><div class="j-between"><h3>Relevant memory</h3>${chip(records.length+' records','j-outline')}</div>${records.map(m=>`<div class="j-item"><span class="j-grow"><strong style="font-weight:500">${esc(m.text)}</strong><small>${esc(m.source)} · revision ${m.revision}</small></span></div>`).join('')||'<p class="j-small j-muted" style="margin-top:15px">No saved records for this scope.</p>'}</div><div class="j-columns function test(){const t=state.test,a=app('claude');return heading('Connection check','Verify a save and a fresh read across two apps.')+`<div class="j-note">${icon('flask-conical')}Simulation only. No requests are sent to Claude, Codex, or a server.</div><div class="j-box" style="margin-top:20px"><div class="j-row">${appIcon(a)}<span>Claude on Android</span>${icon('arrow-right')}${appIcon(app('codex'))}<span>Codex on laptop</span></div><div class="j-steps">${[['Reach memory service','An endpoint must work independently of your laptop.'],['Check phone write access','The phone can save an explicit project decision.'],['Read from a fresh desktop chat','Codex has read access to the same project.'],['Confirm the current revision','The saved correction replaces its earlier version.']].map((v,i)=>`<div class="j-step ${t?.running?'j-progressing':''}">${icon(!t?'circle':t.running?'loader-circle':i<t.passed?'circle-check':i===t.passed?'circle-x':'circle')}<div><strong>${v[0]}</strong><p>${!t||t.running?v[1]:i<t.passed?'Passed in simulation':i===t.passed?t.reason:'Not run'}</p></div></div>`).join('')}</div><div class="j-row">${btn(t?.running?'Checking…':t?'Run again':'Run demo check','run-test','','j-primary')}${t&&!t.running&&t.passed<4?btn('Fix setup',state.online?'connection':'nav',state.online?'claude':'settings'):''}</div>${t&&!t.running&&t.passed===4?`<div class="j-note" style="margin-top:20px">${icon('circle-check')}The sample loop passes. A real pilot must verify the same actions on your accounts and devices.</div>`:''}</div>`}

 if(act==='cycle-theme'){appearance=appearance==='System'?'Light':appearance==='Light'?'Dark':'System';applyTheme();return}
 if(act==='nav')return navigate(id);
 if(['connection','memory-detail','project','skill','source','skill-setup','skill-read','forget'].includes(act))return navigate(act,id);
 if(act==='history'){state.memoryHistory=!state.memoryHistory;return render()}
 if(act==='correct')return navigate('save',id);
 if(act==='preview-app'){state.previewApp=id;const a=app(id);state.previewProject=a.projects[0]||'pilot';return navigate('preview')}
 if(act==='preview-project'){state.previewProject=id;return navigate('preview')}
 if(act==='disconnect'){app(id).connected=false;navigate('connections');return notify('Disconnected in this demo. No real account settings changed.')}
 if(act==='confirm-forget'){if(!state.online)return notify('Removal failed: service unavailable. The record is still active.');memories=memories.filter(m=>m.id!==id);navigate('memory');return notify('Removed from active demo retrieval. Earlier source copies may remain.')}
 if(act==='handoff')return navigate('handoff');
 if(act==='copy'){const field=main.querySelector('[data-part="copy-text"]');try{await navigator.clipboard.writeText(field.value);notify('Sample text copied. No agent was launched.')}catch{field.focus();field.select();notify('Text selected. Use your device’s Copy action.')}return}
 if(act==='install-skill'){const a=app('codex');if(!a.skills.includes(id))a.skills.push(id);navigate('skill',id);return notify('Marked installed in the demo. Nothing was installed on your machine.')}
 if(act==='run-test'){if(state.test?.running)return;state.test={running:true};render();setTimeout(()=>{const a=app('claude'),c=app('codex');state.test=!state.online?{passed:0,reason:'Memory service is unavailable.'}:!a.connected||!a.write||!a.projects.includes('pilot')?{passed:1,reason:'Claude needs a connected account, save permission, and JEFF v2 access.'}:!c.connected||!c.read||!c.projects.includes('pilot')?{passed:2,reason:'Codex needs read permission for JEFF v2.'}:{passed:4,reason:''};if(state.route==='test')render();notify(state.test.passed===4?'Simulated connection check passed.':'Simulated check found a configuration gap.');},650)}
});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!['checkbox','radio'].includes(e.target.type)){const form=e.target.closest('form');if(form){e.preventDefault();if(form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}))}}});
root.addEventListener('change',e=>{const c=e.target.dataset.control;if(c==='memory-filter'){state.filter=e.target.value;render()}if(c==='preview-app'){state.previewApp=e.target.value;render()}if(c==='preview-project'){state.previewProject=e.target.value;render()}if(c==='save-scope'){main.querySelector('[data-part="save-project"]').hidden=e.target.value==='user'}});
root.addEventListener('input',e=>{if(e.target.dataset.control==='memory-search'){state.query=e.target.value;const list=memories.filter(m=>(state.filter==='all'||m.scope===state.filter)&&(m.text+' '+scope(m)).toLowerCase().includes(state.query.toLowerCase()));main.querySelector('[data-part="memory-results"]').innerHTML=list.length?`<div class="j-box j-list">${list.map(memoryRow).join('')}</div>`:'<div class="j-empty"><h3>No matching memories</h3><p>Try another phrase or scope.</p></div>';paint()}});
root.addEventListener('submit',e=>{e.preventDefault();const f=e.target,data=new FormData(f),type=f.dataset.form;
 if(type==='connection'){const a=app(f.dataset.id);a.read=data.has('read');a.write=data.has('write');a.projects=data.getAll('projects');a.connected=true;state.test=null;navigate('connections');return notify('Demo access saved. The live product must verify backend permissions before reporting success.')}
 if(type==='memory'){if(!state.online)return notify('Save failed: memory service unavailable. Your text is still here; retry when available.');const statement=String(data.get('statement')).trim();if(!statement)return notify('Enter a statement to save.');let m=memories.find(x=>x.id===f.dataset.id);if(m){m.history.unshift({text:m.text,revision:m.revision,date:m.date});m.text=statement;m.revision++;m.source='You · JEFF companion';m.date='Just now'}else{const sc=data.get('scope'),pid=sc==='user'?'':data.get('project');m={id:'m'+Date.now(),text:statement,scope:sc,project:pid,space:sc==='user'?'Personal':project(pid).space,type:sc==='user'?'Preference':'Decision',source:'You · JEFF companion',date:'Just now',revision:1,history:[]};if(sc==='repo'&&!project(pid)?.repo)return notify('This project has no registered repository. Choose a repository-backed project or save at project scope.');memories.unshift(m)}navigate('memory-detail',m.id);return notify('Saved in this demo · revision '+m.revision+'. Available immediately in the context preview.')}
 if(type==='settings'){const endpoint=String(data.get('endpoint'));if(!endpoint.startsWith('https://'))return notify('Use an HTTPS endpoint for this remotely accessed service.');state.storage=data.get('storage');state.endpoint=endpoint;state.online=data.has('online');state.test=null;render();return notify('Demo configuration saved. No backend was connected or migrated.')}
 if(type==='project'){const name=String(data.get('name')).trim(),brief=String(data.get('brief')).trim(),source=String(data.get('source')).trim();if(!name||!brief||!source)return notify('Provide a name, brief, and source reference.');const p={id:'p'+Date.now(),name,brief,source,space:data.get('space'),tracker:data.get('tracker'),repo:null,description:brief,task:'No sample task linked',next:'Open the authoritative tracker for current work.'};projects.push(p);navigate('project',p.id);notify('Demo project added. No app has access until you grant it in Connections.')}
});
render();
function applyDesign(){root.style.setProperty('--j-radius',design.corners+'px');root.classList.toggle('j-compact',design.density==='Compact');const ember=design.tone==='Vermilion';root.style.setProperty('--j-accent',ember?'light-dark(#c34128,#ffab92)':'light-dark(#315beb,#98b1ff)');root.style.setProperty('--j-on',ember?'light-dark(#ffffff,#421b10)':'light-dark(#ffffff,#122650)');root.style.setProperty('--j-tint',ember?'light-dark(#fceee9,#3a2724)':'light-dark(#edf1fe,#232d4a)');root.style.setProperty('--j-accent-line',ember?'light-dark(#efb49f,#824c3c)':'light-dark(#b8c9ff,#465b96)');root.style.setProperty('--j-accent-soft',ember?'light-dark(#fff4f0,#302421)':'light-dark(#f0f4ff,#1b2337)')}
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});tweak.addSelect(design,'tone',{label:'Accent direction',options:['Cobalt','Vermilion']});tweak.addSelect(design,'density',{label:'Density',options:['Comfortable','Compact']});tweak.addSlider(design,'corners',{label:'Surface corners',min:6,max:16,unit:'px'})}
})();
</script>
